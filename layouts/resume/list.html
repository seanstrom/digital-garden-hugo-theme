{{ define "main" }}

{{ $permalink := .RelPermalink }}
{{$Section := .Site.GetPage "section" .Section }}

<div class="resume-container site-container">
  <article class="resume">
    
    {{ $title := .Params.title }}
    <h1 class="main-header resume-header">{{ $title }}</h1>

    {{ $desc := .Params.description }}
    <h2 class="main-subheader resume-subheader">{{ $desc }}</h2>

    <section class="resume-content">
      {{ .Content }}
    </section>

  </article>
</div>

{{ end }}
